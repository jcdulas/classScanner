<!--
  Icon of the extension: a class card above two derived classes, linked by the UML
  inheritance arrow, drawn as glass on the VS Code blue.
  The PNG used by VS Code is rendered from this file with `npm run icon`.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36a3ff"/>
      <stop offset="0.55" stop-color="#0078d4"/>
      <stop offset="1" stop-color="#3b2fb8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcebff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#06214d" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background: a rounded square with a soft light from the top left. -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#background)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#glow)"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="54.5" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>

  <!-- Inheritance links: from the two derived classes up to a hollow triangle under the base class. -->
  <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M76 180V160H180V180"/>
    <path d="M128 160V146"/>
    <path d="M128 122L144 146H112Z" fill="#0b63c4" fill-opacity="0.55"/>
  </g>

  <!-- Base class card: a white header and two member lines on glass. -->
  <g filter="url(#shadow)">
    <rect x="52" y="38" width="152" height="84" rx="18" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.75" stroke-width="3"/>
    <path d="M52 70V56a18 18 0 0 1 18-18h116a18 18 0 0 1 18 18v14Z" fill="url(#header)"/>
    <rect x="68" y="50" width="62" height="9" rx="4.5" fill="#0b63c4"/>
    <circle cx="73" cy="86" r="5" fill="#8ff0a4"/>
    <rect x="86" y="81.5" width="92" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.92"/>
    <circle cx="73" cy="104" r="5" fill="#ffd866"/>
    <rect x="86" y="99.5" width="64" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.92"/>
  </g>

  <!-- Derived class cards. -->
  <g filter="url(#shadow)">
    <rect x="36" y="180" width="80" height="44" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.75" stroke-width="3"/>
    <path d="M36 200v-6a14 14 0 0 1 14-14h52a14 14 0 0 1 14 14v6Z" fill="url(#header)"/>
    <rect x="140" y="180" width="80" height="44" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.75" stroke-width="3"/>
    <path d="M140 200v-6a14 14 0 0 1 14-14h52a14 14 0 0 1 14 14v6Z" fill="url(#header)"/>
  </g>
</svg>
