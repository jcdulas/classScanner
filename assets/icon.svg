<!--
  Icon of the extension: a class card above two derived classes, linked by the UML
  inheritance arrow. It is drawn in the flat style of VS Code: plain colors, thick
  even strokes, no gradient and no shadow, on the VS Code blue (#007acc).
  The PNG used by VS Code is rendered from this file with `npm run icon`.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Background: a rounded square, with a darker facet in the bottom right corner. -->
  <rect x="8" y="8" width="240" height="240" rx="36" fill="#007acc"/>
  <path d="M248 96V212a36 36 0 0 1-36 36H96Z" fill="#0065a9"/>

  <!-- Inheritance links: from the two derived classes up to a hollow triangle under the base class. -->
  <g fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M76 184V164H180V184"/>
    <path d="M128 164V152"/>
    <path d="M128 128L145 152H111Z"/>
  </g>

  <!-- Base class card: a header with the class name, then a method (diamond) and an attribute (circle). -->
  <rect x="56" y="40" width="144" height="84" rx="8" fill="#005a9e" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
  <rect x="56" y="40" width="144" height="30" fill="#ffffff"/>
  <rect x="70" y="50" width="56" height="10" rx="2" fill="#007acc"/>
  <path d="M76 81l7 7-7 7-7-7Z" fill="#ffffff"/>
  <rect x="92" y="83" width="84" height="10" rx="2" fill="#ffffff"/>
  <circle cx="76" cy="107" r="6" fill="#ffffff"/>
  <rect x="92" y="102" width="58" height="10" rx="2" fill="#ffffff"/>

  <!-- Derived class cards. -->
  <rect x="40" y="186" width="72" height="40" rx="8" fill="#005a9e" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
  <rect x="40" y="186" width="72" height="16" fill="#ffffff"/>
  <rect x="144" y="186" width="72" height="40" rx="8" fill="#005a9e" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
  <rect x="144" y="186" width="72" height="16" fill="#ffffff"/>
</svg>
