<!DOCTYPE html>
<!--
  Shows the webview in a plain browser, outside of VS Code (scripts/previewWebview.mjs).
  It provides what VS Code normally provides: the theme CSS variables, the body
  class of the theme, and `acquireVsCodeApi`. The URL parameters choose the theme
  and a scenario of scripted mouse actions.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>classScanner preview</title>
  <style id="theme"></style>
  <link rel="stylesheet" href="webview/main.css">
</head>
<body>
  <div id="app"></div>
  <script>
    const parameters = new URLSearchParams(location.search);
    const themeName = parameters.get('theme') || 'dark';
    const scenario = parameters.get('scenario') || 'default';

    // A subset of the colors of the default VS Code themes ("Dark Modern" and "Light Modern").
    const THEMES = {
      dark: {
        'editor-background': '#1f1f1f', 'foreground': '#cccccc', 'editor-foreground': '#cccccc',
        'descriptionForeground': '#9d9d9d', 'editorWidget-background': '#202020', 'editorWidget-border': '#454545',
        'focusBorder': '#0078d4', 'sideBar-background': '#181818', 'panel-border': '#2b2b2b',
        'sideBarTitle-foreground': '#cccccc', 'button-background': '#0078d4', 'button-foreground': '#ffffff',
        'widget-shadow': 'rgba(0,0,0,0.36)', 'list-hoverBackground': '#2a2d2e',
        'charts-red': '#f14c4c', 'charts-blue': '#3794ff', 'charts-yellow': '#cca700', 'charts-orange': '#d18616',
        'charts-green': '#89d185', 'charts-purple': '#b180d7', 'charts-lines': '#808080',
        'inputValidation-warningBackground': '#352a05', 'inputValidation-warningBorder': '#b89500',
      },
      light: {
        'editor-background': '#ffffff', 'foreground': '#3b3b3b', 'editor-foreground': '#3b3b3b',
        'descriptionForeground': '#717171', 'editorWidget-background': '#f8f8f8', 'editorWidget-border': '#c8c8c8',
        'focusBorder': '#005fb8', 'sideBar-background': '#f8f8f8', 'panel-border': '#e5e5e5',
        'sideBarTitle-foreground': '#3b3b3b', 'button-background': '#005fb8', 'button-foreground': '#ffffff',
        'widget-shadow': 'rgba(0,0,0,0.16)', 'list-hoverBackground': '#f2f2f2',
        'charts-red': '#e51400', 'charts-blue': '#1a85ff', 'charts-yellow': '#bf8803', 'charts-orange': '#d18616',
        'charts-green': '#388a34', 'charts-purple': '#652d90', 'charts-lines': '#808080',
        'inputValidation-warningBackground': '#f6f5d2', 'inputValidation-warningBorder': '#b89500',
      },
    };
    const variables = Object.entries(THEMES[themeName]).map(([name, value]) => `--vscode-${name}: ${value};`).join('\n');
    document.getElementById('theme').textContent = `:root {
      ${variables}
      --vscode-font-family: "Segoe UI", system-ui, sans-serif;
      --vscode-font-size: 13px;
      --vscode-editor-font-family: Consolas, "Courier New", monospace;
    }`;
    document.body.className = themeName === 'dark' ? 'vscode-dark' : 'vscode-light';

    window.classScannerBootConfig = { layoutWorkerUrl: 'webview/layoutWorker.js' };

    function mouse(type, x, y, options = {}) {
      const canvas = document.querySelector('.diagram-host canvas');
      const bounds = canvas.getBoundingClientRect();
      const init = { bubbles: true, clientX: bounds.left + x, clientY: bounds.top + y, button: 0, pointerId: 1, ...options };
      const EventClass = type.startsWith('pointer') ? PointerEvent : MouseEvent;
      canvas.dispatchEvent(new EventClass(type, init));
    }
    function wheel(x, y, deltaY) {
      const canvas = document.querySelector('.diagram-host canvas');
      const bounds = canvas.getBoundingClientRect();
      canvas.dispatchEvent(new WheelEvent('wheel', { bubbles: true, cancelable: true, clientX: bounds.left + x, clientY: bounds.top + y, deltaY }));
    }
    function dragRectangle(fromX, fromY, toX, toY, options) {
      mouse('pointerdown', fromX, fromY, options);
      mouse('pointermove', (fromX + toX) / 2, (fromY + toY) / 2, options);
      mouse('pointermove', toX, toY, options);
      mouse('pointerup', toX, toY, options);
    }
    const wait = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

    // Scripted actions, run once the diagram is on screen.
    const SCENARIOS = {
      default: async () => {},
      // Ctrl + drag a rectangle over the middle of the diagram.
      selection: async () => {
        const host = document.querySelector('.diagram-host');
        dragRectangle(host.clientWidth * 0.42, host.clientHeight * 0.25, host.clientWidth * 0.7, host.clientHeight * 0.75, { ctrlKey: true });
      },
      // Zoom in until the members are shown.
      zoom: async () => {
        const host = document.querySelector('.diagram-host');
        for (let step = 0; step < 6; step++) {
          wheel(host.clientWidth * 0.55, host.clientHeight * 0.5, -160);
          await wait(60);
        }
      },
      // Zoom in on the point given by the `x` and `y` URL parameters (fractions of the view size).
      zoomAt: async () => {
        const host = document.querySelector('.diagram-host');
        for (let step = 0; step < 8; step++) {
          wheel(host.clientWidth * Number(parameters.get('x')), host.clientHeight * Number(parameters.get('y')), -160);
          await wait(60);
        }
      },
      // Double-click at the `x`, `y` point: on a group title it collapses the group, on a card it opens the
      // code under the pointer (the other side with `shift=1`), and with `alt=1` it cycles the mode of the card.
      // The preview script prints the files that the double-click asked the editor to open.
      doubleClick: async () => {
        const host = document.querySelector('.diagram-host');
        const options = { altKey: parameters.get('alt') === '1', shiftKey: parameters.get('shift') === '1' };
        mouse('dblclick', host.clientWidth * Number(parameters.get('x')), host.clientHeight * Number(parameters.get('y')), options);
        await wait(1500);
      },
      // Drag from the `x`, `y` point 300 pixels to the right. With `undo=1`, press Ctrl+Z afterwards.
      drag: async () => {
        const host = document.querySelector('.diagram-host');
        const startX = host.clientWidth * Number(parameters.get('x'));
        const startY = host.clientHeight * Number(parameters.get('y'));
        dragRectangle(startX, startY, startX + 300, startY + 40, {});
        await wait(400);
        if (parameters.get('undo') === '1') {
          window.dispatchEvent(new KeyboardEvent('keydown', { key: 'z', ctrlKey: true, bubbles: true }));
          await wait(900);
        }
      },
      // Ctrl + click two cards, then drag the first one 200 pixels to the right: both must move.
      multiDrag: async () => {
        const host = document.querySelector('.diagram-host');
        const first = { x: host.clientWidth * 0.52, y: host.clientHeight * 0.29 };
        const second = { x: host.clientWidth * 0.59, y: host.clientHeight * 0.51 };
        for (const point of [first, second]) {
          mouse('pointerdown', point.x, point.y, { ctrlKey: true });
          mouse('pointerup', point.x, point.y, { ctrlKey: true });
          await wait(100);
        }
        dragRectangle(first.x, first.y, first.x + 200, first.y, {});
      },
      // Ctrl + click a card twice: selected, then unselected.
      ctrlClickTwice: async () => {
        const host = document.querySelector('.diagram-host');
        const point = { x: host.clientWidth * 0.52, y: host.clientHeight * 0.29 };
        for (let count = 0; count < 2; count++) {
          mouse('pointerdown', point.x, point.y, { ctrlKey: true });
          mouse('pointerup', point.x, point.y, { ctrlKey: true });
          await wait(150);
        }
      },
      // Select cards with a rectangle, then open the panel of the "LLM schema" button.
      schemaPanel: async () => {
        const host = document.querySelector('.diagram-host');
        dragRectangle(host.clientWidth * 0.42, host.clientHeight * 0.25, host.clientWidth * 0.7, host.clientHeight * 0.75, { ctrlKey: true });
        await wait(300);
        const button = Array.from(document.querySelectorAll('.selection-bar .glass-button')).find((element) => element.textContent.includes('LLM schema'));
        button.click();
      },
      // Select cards with a rectangle, then open the panel of the "Interface" button. With `text=uses`,
      // show the second list of the panel. With `text=precise`, press "Check calls with the C++ extension":
      // the harness answers with one call that the scan did not find.
      interfacePanel: async () => {
        const host = document.querySelector('.diagram-host');
        dragRectangle(host.clientWidth * 0.42, host.clientHeight * 0.25, host.clientWidth * 0.7, host.clientHeight * 0.55, { ctrlKey: true });
        await wait(300);
        const button = Array.from(document.querySelectorAll('.selection-bar .glass-button')).find((element) => element.title.startsWith('List how the selection'));
        button.click();
        await wait(300);
        if (parameters.get('text') === 'uses') {
          document.querySelectorAll('.interface-panel .segment')[1].click();
        } else if (parameters.get('text') === 'precise') {
          document.querySelector('.interface-note .glass-button').click();
          await wait(300);
        }
      },
      // Open the "Analysis" panel on the list named by `text`: cycles (the first cycle is unfolded), path
      // (two cards are selected with Ctrl + click first), usage or changes (the harness answers the
      // request with changed lines in two files).
      analysisPanel: async () => {
        const host = document.querySelector('.diagram-host');
        const tab = parameters.get('text') || 'cycles';
        if (tab === 'path') {
          for (const point of [{ x: 0.52, y: 0.29 }, { x: 0.59, y: 0.51 }]) {
            mouse('pointerdown', host.clientWidth * point.x, host.clientHeight * point.y, { ctrlKey: true });
            mouse('pointerup', host.clientWidth * point.x, host.clientHeight * point.y, { ctrlKey: true });
            await wait(100);
          }
        }
        document.querySelector('.glass-button[title^="Analysis"]').click();
        await wait(300);
        const tabs = ['cycles', 'path', 'usage', 'changes'];
        document.querySelectorAll('.analysis-panel .segment')[tabs.indexOf(tab)].click();
        await wait(300);
        if (tab === 'cycles') {
          document.querySelector('.analysis-panel .interface-class-name')?.click();
        } else if (tab === 'changes') {
          document.querySelector('.analysis-panel .analysis-actions .glass-button').click();
        }
        await wait(300);
      },
      // Show the class of line `count` of the file `text`, as the "Show Class in Diagram" command of the editor does.
      reveal: async () => {
        const file = graphFiles.indexOf(parameters.get('text'));
        window.postMessage({ type: 'revealSource', file, line: Number(parameters.get('count') || '1') }, '*');
        await wait(1200);
      },
      // Type the `text` URL parameter in the search box.
      search: async () => {
        const input = document.querySelector('.search-field input');
        input.focus();
        input.value = parameters.get('text');
        input.dispatchEvent(new Event('input', { bubbles: true }));
      },
      // Click the row of the side panel whose label is the `text` URL parameter, for example "Structs".
      toggleRow: async () => {
        const rows = Array.from(document.querySelectorAll('.side-panel .toggle-row'));
        rows.find((row) => row.querySelector('.row-label').textContent === parameters.get('text')).click();
        await wait(2500);
      },
      // Right-click in the middle of the diagram.
      menu: async () => {
        const host = document.querySelector('.diagram-host');
        mouse('contextmenu', host.clientWidth * 0.55, host.clientHeight * 0.5, { button: 2 });
      },
      // Right-click at the `x`, `y` point: on a card, the menu offers the files of the class.
      menuAt: async () => {
        const host = document.querySelector('.diagram-host');
        mouse('contextmenu', host.clientWidth * Number(parameters.get('x')), host.clientHeight * Number(parameters.get('y')), { button: 2 });
      },
      // Move the pointer to the `x`, `y` point: an arrow under it is highlighted and described in a tooltip.
      hover: async () => {
        const host = document.querySelector('.diagram-host');
        mouse('pointermove', host.clientWidth * Number(parameters.get('x')), host.clientHeight * Number(parameters.get('y')));
        await wait(300);
      },
      // Click at the `x`, `y` point, `count` times in a row (2 is a double-click, which opens the code under
      // the pointer). With `alt=1`, hold Alt; with `shift=1`, hold Shift.
      // On an arrow, the click opens the declaration of its relation.
      // The preview script prints the files that the clicks asked the editor to open.
      click: async () => {
        const host = document.querySelector('.diagram-host');
        const x = host.clientWidth * Number(parameters.get('x'));
        const y = host.clientHeight * Number(parameters.get('y'));
        const options = { altKey: parameters.get('alt') === '1', shiftKey: parameters.get('shift') === '1' };
        const count = Number(parameters.get('count') || '1');
        for (let index = 0; index < count; index++) {
          mouse('pointerdown', x, y, options);
          mouse('pointerup', x, y, options);
        }
        if (count === 2) {
          mouse('dblclick', x, y, options);
        }
        await wait(1500);
      },
    };

    const sentMessages = [];
    // The `openSource` requests of the webview, as `path:line`, read by the preview script.
    window.previewOpenedSources = [];
    let graphFiles = [];
    let graphNodes = [];
    window.acquireVsCodeApi = () => ({
      setState() {},
      postMessage(message) {
        sentMessages.push(message);
        if (message.type === 'ready') {
          fetch('graph.json').then((response) => response.json()).then((graphMessage) => {
            graphFiles = graphMessage.graph.files;
            graphNodes = graphMessage.graph.nodes;
            window.postMessage(graphMessage, '*');
          });
        } else if (message.type === 'openSource') {
          window.previewOpenedSources.push(`${graphFiles[message.file]}:${message.line}`);
        } else if (message.type === 'requestPreciseCalls') {
          // Stands for the C++ language extension: a method of the last class that was not asked about
          // calls the last method of the first class asked about.
          const asked = graphNodes.find((node) => message.classIds.includes(node.id) && node.methods.length > 0);
          const callers = graphNodes.filter((node) => !message.classIds.includes(node.id) && node.methods.length > 0);
          const caller = callers[callers.length - 1];
          const calls = [];
          if (asked !== undefined && asked.methods.length > 0 && caller !== undefined) {
            const method = caller.methods[0];
            const other = { file: method.file, firstLine: method.line, lastLine: method.line, name: method.name };
            const askedMethod = asked.methods[asked.methods.length - 1].name;
            calls.push({ direction: 'incoming', classId: asked.id, method: askedMethod, other, file: method.file, line: method.line });
          }
          window.postMessage({ type: 'preciseCalls', classIds: message.classIds, calls, askedMethodCount: 7, unansweredMethodCount: 2, wasCancelled: false }, '*');
        } else if (message.type === 'requestChanges') {
          // Stands for git: a few changed lines in the first source file and in the first header.
          const files = [graphFiles.findIndex((file) => file.endsWith('.cpp')), graphFiles.findIndex((file) => file.endsWith('.h'))]
            .filter((file) => file >= 0)
            .map((file) => ({ file, ranges: [{ firstLine: 6, lastLine: 26 }] }));
          window.postMessage({ type: 'changes', reference: message.reference || 'main', files }, '*');
        } else if (message.type === 'diagramShown') {
          wait(900).then(() => SCENARIOS[scenario]()).then(() => wait(700)).then(() => {
            document.title = 'preview-ready';
          });
        } else if (message.type === 'error') {
          document.title = 'preview-error: ' + message.message;
          console.error(message.message, message.stack);
        }
      },
    });
  </script>
  <script src="webview/main.js"></script>
</body>
</html>
